id = "ubuntudroid.coder-sessions"
name = "Coder Agent Sessions"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Browse running Coder agent sessions and open each as its own workspace: agentty on the session, with its changes mirrored into a local worktree so a review pane works even before there is a PR. Coder task workspaces have no tmux -- the agent runs under agentapi -- so agentty is what makes the session scrollable and typable."
platforms = ["linux", "macos"]

[[actions]]
id = "pick"
title = "Coder sessions: pick and open"
contexts = ["workspace", "tab", "pane"]
# Action commands run without a terminal, so this only asks herdr to open the
# `list` pane below; the picker itself needs a TTY for fzf.
command = ["python3", "coder-sessions.py", "--pane"]

[[panes]]
id = "list"
title = "Coder sessions"
# The picker is transient and should not disturb the tiled layout; a popup is
# session-modal and receives all input, including Escape.
placement = "popup"
width = "90%"
height = "80%"
command = ["python3", "coder-sessions.py"]

# Refresh the mirror behind the focused session workspace. Bound to prefix+ctrl+m;
# the idle hook agentty fires does this automatically after each agent turn.
[[actions]]
id = "refresh"
title = "Coder sessions: refresh this mirror"
contexts = ["workspace", "tab", "pane"]
command = ["python3", "coder-sessions.py", "--refresh"]

# The offer to move a session into a mirror, once the agent has branched. A split
# beside the agent, not the popup the picker uses: this opens while the agent is
# mid-task, and a session-modal popup would swallow what is being typed at it.
[[panes]]
id = "promote"
title = "Coder sessions: mirror this session?"
placement = "split"
command = ["python3", "coder-sessions.py", "--promote"]

# Open the focused session's page in the Coder web UI, in the default browser.
# Bound to prefix+ctrl+w. Read-only, so it settles for the session name on the
# agentty pane when the metadata token has not survived a herdr restart.
[[actions]]
id = "web"
title = "Coder sessions: open this session in the web UI"
contexts = ["workspace", "tab", "pane"]
command = ["python3", "coder-sessions.py", "--web"]

# Take the focused session over locally: render its remote conversation into the
# worktree, drop the mirror, and start a local agent there. The Coder workspace is
# left running on purpose -- the local agent may need to ssh in for a tool output
# the handover does not carry, and pausing a task stops its workspace.
[[actions]]
id = "takeover"
title = "Coder sessions: take over locally"
contexts = ["workspace", "tab", "pane"]
command = ["python3", "coder-sessions.py", "--takeover"]
